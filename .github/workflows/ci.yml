name: Java CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend-build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service:
          - api-gateway
          - auth-service
          - inventory-service
          - notification-service
          - order-service
          - payment-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Project
        run: mvn clean package -DskipTests

  ui-build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ecommerce-ui

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecommerce-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build React UI
        run: npm run build
  docker-build:

    needs:
      - backend-build
      - ui-build

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service:
          - api-gateway
          - auth-service
          - inventory-service
          - notification-service
          - order-service
          - payment-service

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build JAR
        working-directory: ${{ matrix.service }}
        run: mvn clean package -DskipTests

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ matrix.service }}:latest \
            ./${{ matrix.service }}