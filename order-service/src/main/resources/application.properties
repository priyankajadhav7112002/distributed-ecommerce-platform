server.port=8081

spring.application.name=order-service
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_orders
spring.datasource.username=postgres
spring.datasource.password=priyanka

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.group-id=order-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
#spring.kafka.consumer.properties.spring.json.type.mapping=com.ecommerce.paymentservice.event.PaymentCompletedEvent:com.ecommerce.orderservice.event.PaymentCompletedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.orderservice.event.PaymentCompletedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*